olid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}.badge{display:inline-block;padding:5px 9px;background:var(--sky);color:var(--blue-dark);border-radius:999px;font:700 .75rem Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em}.panel h2{margin:.6rem 0;font-size:clamp(1.65rem,5vw,2.4rem);line-height:1.05}.lead{color:var(--muted);font-size:1.08rem}.question{margin:22px 0 12px;font-size:1.25rem;font-weight:bold}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;padding:14px;border:2px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-weight:bold}.choice:hover:not(:disabled),.choice:focus-visible{border-color:var(--blue);outline:none;background:#f2f8ff}.choice.correct{border-color:var(--green);background:#eaf8f1}.choice.wrong{border-color:var(--red);background:#fff0f0}.choice:disabled{cursor:default}.feedback{min-height:26px;margin:18px 0 0;font-weight:bold}.ok{color:var(--green)}.no{color:var(--red)}.explain{display:block;margin-top:7px;color:var(--ink);font-weight:normal}.passage,.result,.dictation-box{margin:18px 0;padding:17px;border-radius:12px;background:#f4f8f7;border:1px solid var(--line)}textarea,.word-input{width:100%;min-height:118px;padding:12px;border:2px solid var(--line);border-radius:10px;resize:vertical;color:var(--ink);background:#fff;font-size:1.05rem}textarea:focus,.word-input:focus{outline:3px solid rgba(33,105,168,.22);border-color:var(--blue)}.word-input{min-height:auto;font-size:1.4rem}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.primary,.secondary{padding:12px 16px;border-radius:10px;border:2px solid var(--blue);font-weight:bold}.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue-dark)}.secondary{background:#fff;color:var(--blue)}.hint{font-size:.9rem;color:var(--muted)}.word-card{margin:18px 0;padding:18px;border:2px dashed var(--orange);border-radius:14px;background:#fff8e8;text-align:center;font:700 clamp(2.2rem,10vw,4rem)/ const $=s=>document.querySelector(s); const app=$('#app');
let subject=localStorage.getItem('rutaSubject')||'lengua'; let grade=localStorage.getItem('rutaGrade')||'1'; let station=''; let index=0; let done=[]; let exam=[]; let examIndex=0; let score=0; let hangman={word:'',guesses:[]};
function model(){return subject==='lengua'?lang[grade]:subject==='sociales'?social[grade]:natural[grade]}
function validGrades(){return subject==='lengua'?['1','3','3t2']:['3']}
function progressKey(){return `ruta-v3-${subject}-${grade}`}
function migrateDone(){let saved=JSON.parse(localStorage.getItem(progressKey())||'[]');if(subject==='lengua'&&saved.length===0){const old=JSON.parse(localStorage.getItem(`lenguaDone-v2-${grade}`)||localStorage.getItem(`lenguaDone${grade}`)||'[]');const valid=model().stations.map(s=>s.id);saved=old.map(x=>x==='syn'||x==='ant'?'vocab':x).filter(x=>valid.includes(x));}saved=[...new Set(saved)].filter(x=>model().stations.some(s=>s.id===x));localStorage.setItem(progressKey(),JSON.stringify(saved));return saved}
function setupSelectors(){const subjectSelect=$('#subject'),gradeSelect=$('#grade'),labels=subject==='lengua'?{'1':'1.º de Primaria','3':'3.º de Primaria · Tema 1','3t2':'3.º de Primaria · Tema 2'}:{'3':'3.º de Primaria'};subjectSelect.value=subject;gradeSelect.innerHTML=validGrades().map(g=>`<option value="${g}">${labels[g]||g}</option>`).join('');if(!validGrades().includes(grade))grade=validGrades()[0];gradeSelect.value=grade;subjectSelect.onchange=e=>{subject=e.target.value;grade=validGrades()[0];switchRoute()};gradeSelect.onchange=e=>{grade=e.target.value;switchRoute()}}
function switchRoute(){localStorage.setItem('rutaSubject',subject);localStorage.setItem('rutaGrade',grade);setupSelectors();done=migrateDone();station=model().stations[0].id;index=0;hangman={word:'',guesses:[]};refreshStations();render()}
function refreshStations(){$('.stations').innerHTML=model().stations.map(s=>`<button class="station" data-station="${s.id}"><strong>${s.title}</strong><small>${s.subtitle}</small></button>`).join('');document.querySelectorAll('.station').forEach(b=>b.onclick=()=>{station=b.dataset.station;index=0;hangman={word:'',guesses:[]};render()})}
function updateHeader(){const name=subject==='sociales'?'Ciencias Sociales':subject==='naturales'?'Ciencias Naturales':'Lengua';const isNatural=subject==='naturales';const isSocial=subject==='sociales';$('#eyebrow').textContent=`Juego de deberes · ${name}`;$('#intro').textContent=isNatural?'Completa las cuatro paradas de Ciencias Naturales y desbloquea el examen final.':isSocial?'Completa las tres paradas de Ciencias Sociales y desbloquea el examen final.':'Elige una asignatura, completa las tres paradas y desbloquea el examen final.';$('#footer').textContent=isNatural?'Material de repaso elaborado exclusivamente a partir de los cuatro esquemas facilitados para 3.º de Primaria.':isSocial?'Material de repaso elaborado solo a partir de los seis esquemas facilitados para 3.º de Primaria.':'Consejo para adultos: el dictado puede escucharse con el botón de audio o leerse en voz alta sin que el niño vea la frase.'}
function save(){localStorage.setItem(progressKey(),JSON.stringify(done));updateProgress()}
function updateProgress(){const n=done.length,total=model().stations.length;$('#progressText').textContent=`${n} de ${total} paradas completadas`;$('#fill').style.width=(n/total*100)+'%';$('#badgeText').textContent=n===total?'¡Ruta terminada!':n>1?'Aprendiz':'Explorador/a';document.querySelectorAll('.station').forEach(b=>b.classList.toggle('done',done.includes(b.dataset.station)))}
function markDone(){if(!done.includes(station)){done.push(station);save()}}
function renderChoice(s){const q=s.questions[index],isChallenge=String(q[0]).startsWith('🧠 Reto:');app.innerHTML=`<div class="badge">${s.title}</div><h2>${s.title.replace(/^\d\. /,'')}</h2><p class="lead">${s.intro}</p>${isChallenge?'<p class="hint"><strong>🧠 Reto de razonamiento:</strong> piensa qué conclusión encaja mejor.</p>':''}${s.passage?`<div class="passage">${s.passage}</div>`:''}<div class="question">${q[0]}</div><div class="choices">${q[1].map((x,i)=>`<button class="choice" onclick="answer(${i})">${x}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function answer(selected){const q=model().stations.find(s=>s.id===station).questions[index],correct=q[2],good=selected===correct;document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});$('#feedback').innerHTML=good?'<span class="ok">¡Muy bien! Has acertado.</span>':`<span class="no">Casi. La respuesta correcta está marcada en verde.${q[3]?`<span class="explain">${q[3]}</span>`:''}</span>`;setTimeout(()=>{index++;const s=model().stations.find(x=>x.id===station);if(index>=s.questions.length){markDone();finishStation()}else render()},good?850:1600)}
function renderWrite(s){const word=s.words[index];app.innerHTML=`<div class="badge">${s.title}</div><h2>Copia una palabra</h2><p class="lead">${s.intro}</p><div class="word-card">${word}</div><label class="sr-only" for="wordInput">Escribe la palabra</label><input class="word-input" id="wordInput" autocomplete="off" autocapitalize="off" placeholder="Escribe aquí"><div class="actions"><button class="primary" onclick="checkWord()">Comprobar</button></div><p class="feedback" id="feedback"></p>`}
function checkWord(){const s=model().stations.find(x=>x.id===station),word=s.words[index],input=$('#wordInput'),good=input.value.trim().toLowerCase()===word;input.disabled=true;$('#feedback').innerHTML=good?'<span class="ok">¡Muy bien! La has escrito correctamente.</span>':`<span class="no">La palabra era «${word}».</span>`;setTimeout(()=>{index++;if(index>=s.words.length){markDone();finishStation()}else render()},900)}
function renderHangman(s){if(!hangman.word)hangman={word:s.words[Math.floor(Math.random()*s.words.length)],guesses:[]};const letters='abcdefghijklmnñopqrstuvwxyz'.split(''),word=hangman.word,visible=word.split('').map(l=>hangman.guesses.includes(l)?l:'_').join(' '),mistakes=hangman.guesses.filter(l=>!word.includes(l));app.innerHTML=`<div class="badge">${s.title}</div><h2>Adivina la palabra</h2><p class="lead">Pulsa las letras. Tienes seis intentos que no estén en la palabra.</p><div class="hangman-word">${visible}</div><p class="hint">Fallos: ${mistakes.length} de 6 ${mistakes.length?'· '+mistakes.join(', '):''}</p><div class="letter-grid">${letters.map(l=>`<button class="letter" ${hangman.guesses.includes(l)?'disabled':''} onclick="guessLetter('${l}')">${l}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function guessLetter(letter){if(hangman.guesses.includes(letter))return;hangman.guesses.push(letter);const word=hangman.word,won=word.split('').every(l=>hangman.guesses.includes(l)),mistakes=hangman.guesses.filter(l=>!word.includes(l)).length;if(won){render();$('#feedback').innerHTML='<span class="ok">¡Muy bien! Has adivinado la palabra.</span>';document.querySelectorAll('.letter').forEach(b=>b.disabled=true);markDone();setTimeout(finishStation,1000);return}if(mistakes>=6){app.innerHTML=`<div class="badge">Ahorcado</div><h2>La palabra era «${word}»</h2><p class="lead">No pasa nada. Prueba otra palabra.</p><button class="primary" onclick="hangman={word:'',guesses:[]};render()">Jugar otra vez</button>`;return}render()}
function renderDictation(s){const text=s.text;app.innerHTML=`<div class="badge">${s.title}</div><h2>Escucha y escribe</h2><p class="lead">Pulsa «Reproducir dictado», escucha la frase las veces que necesites y escríbela. No verás el texto antes de comprobarlo.</p><div class="dictation-box"><button class="primary" onclick="speak()">Reproducir dictado</button><audio id="dictationAudio" controls preload="metadata"><source src="audio/dictado-${grade}.mp3" type="audio/mpeg">Tu navegador no puede reproducir el audio.</audio><label class="sr-only" for="dictation">Escribe el dictado</label><textarea id="dictation" autocomplete="off" rows="4" placeholder="Escribe aquí las frases"></textarea><p class="hint">La corrección revisa mayúsculas, minúsculas, tildes y signos de puntuación.</p></div><div class="actions"><button class="primary" onclick="checkDictation()">Comprobar</button></div><p class="feedback" id="feedback"></p>`}
function normalize(s){return s.replace(/\s+/g,' ').trim()}
function speak(){const audio=$('#dictationAudio');audio.currentTime=0;const p=audio.play();if(p)p.catch(()=>{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(model().stations.find(s=>s.id===station).text);u.lang='es-ES';u.rate=.78;speechSynthesis.speak(u)}})}
function checkDictation(){const s=model().stations.find(x=>x.id===station),input=$('#dictation'),good=normalize(input.value)===normalize(s.text);input.disabled=true;$('#feedback').innerHTML=good?'<span class="ok">¡Dictado correcto! Has escrito todas las frases.</span>':`<span class="no">Hay algo que corregir. La solución es: «${s.text}».</span>`;markDone();setTimeout(finishStation,good?850:2200)}
function finishStation(){updateProgress();if(done.length===model().stations.length){const label=subject==='sociales'?'personas y convivencia, colegio y localidad, y seguridad vial':subject==='naturales'?'seres vivos e inertes, los cinco reinos, los animales y los ecosistemas':grade==='1'?'leer, escribir y jugar con las palabras':grade==='3t2'?'adjetivos, el punto y los diminutivos y aumentativos':'sinónimos, antónimos, lectura comprensiva y dictado';if(!model().exam){app.innerHTML=`<div class="badge">Ruta terminada</div><h2>¡Has practicado muy bien!</h2><p class="lead">Has practicado ${label}.</p><button class="primary" onclick="switchRoute()">Jugar otra vez</button>`;return}app.innerHTML=`<div class="badge">Ruta completada</div><h2>¡Todas las paradas superadas!</h2><p class="lead">Has practicado ${label}.</p><div class="result"><strong>El examen está listo.</strong><br>Serán ${['social','mixed','natural'].includes(model().exam)?'10':'8'} preguntas. Al terminar verás la puntuación.</div><button class="primary" onclick="startExam()">Empezar examen</button>`}else{app.innerHTML=`<div class="badge">Parada superada</div><h2>¡Buen trabajo!</h2><p class="lead">Elige otra parada para continuar. Cuando completes todas las paradas, se abrirá el examen.</p>`}}
function startExam(){const stations=model().stations;if(model().exam==='social'){exam=stations.flatMap(s=>s.questions.map(q=>({q,station:s}))).sort(()=>Math.random()-.5).slice(0,10)}else{const questions=stations.filter(s=>s.type==='choice').flatMap(s=>s.questions.map(q=>({q,station:s})));exam=[...questions].sort(()=>Math.random()-.5).slice(0,7);exam.push({dictation:stations.find(s=>s.type==='dictation')})}examIndex=0;score=0;station='exam';renderExam()}
function renderExam(){if(examIndex>=exam.length){const pass=score>=Math.ceil(exam.length*.7);app.innerHTML=`<div class="badge">Examen final terminado</div><h2>${pass?'¡Examen superado!':'Examen terminado'}</h2><div class="result"><strong>${score} de ${exam.length} respuestas correctas.</strong><br>${pass?'Buen trabajo: has terminado la ruta.':'Repasa las actividades y vuelve a intentarlo cuando quieras.'}</div><div class="actions"><button class="primary" onclick="startExam()">Repetir examen</button><button class="secondary" onclick="station=model().stations[0].id;index=0;render()">Volver a actividades</button></div>`;return}const item=exam[examIndex],num=`Pregunta ${examIndex+1} de ${exam.length}`;if(item.dictation){app.innerHTML=`<div class="badge">Examen · ${num}</div><h2>Dictado</h2><p class="lead">Escucha y escribe la frase.</p><div class="dictation-box"><button class="primary" onclick="speakExam()">Reproducir dictado</button><audio id="dictationAudio" controls preload="metadata"><source src="audio/dictado-${grade}.mp3" type="audio/mpeg"></audio><textarea id="examDictation" rows="4" placeholder="Escribe las frases"></textarea></div><button class="primary" onclick="examDictation()">Enviar respuesta</button><p class="feedback" id="feedback"></p>`;return}const q=item.q;app.innerHTML=`<div class="badge">Examen · ${num}</div><h2>Elige la respuesta</h2><div class="question">${q[0]}</div><div class="choices">${q[1].map((x,i)=>`<button class="choice" onclick="examAnswer(${i})">${x}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function examAnswer(selected){const q=exam[examIndex].q,correct=q[2];document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});if(selected===correct)score++;$('#feedback').textContent=selected===correct?'Correcto.':'Respuesta revisada.';setTimeout(()=>{examIndex++;renderExam()},650)}
function speakExam(){const audio=$('#dictationAudio');audio.play()}
function examDictation(){const text=exam[examIndex].dictation.text;if(normalize($('#examDictation').value)===normalize(text))score++;$('#feedback').textContent='Respuesta revisada.';setTimeout(()=>{examIndex++;renderExam()},650)}
function render(){updateHeader();updateProgress();const s=model().stations.find(x=>x.id===station)||model().stations[0];if(s.type==='choice')renderChoice(s);if(s.type==='write')renderWrite(s);if(s.type==='hangman')renderHangman(s);if(s.type==='dictation')renderDictation(s)}

<script>
/* Tarjetas de Sociales: cada visita mezcla tarjetas de elección y de respuesta escrita. */
window.socialDeck=[];
window.orderPicks=[];
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function activeStation(){return model().stations.find(s=>s.id===station)||model().stations[0]}
function prepareStation(){const s=activeStation();window.socialDeck=s.type==='mixed'?shuffle(s.cards):[];window.orderPicks=[]}
function switchRoute(){localStorage.setItem('rutaSubject',subject);localStorage.setItem('rutaGrade',grade);setupSelectors();done=migrateDone();station=model().stations[0].id;index=0;hangman={word:'',guesses:[]};prepareStation();refreshStations();render()}
function refreshStations(){$('.stations').innerHTML=model().stations.map(s=>`<button class="station" data-station="${s.id}"><strong>${s.title}</strong><small>${s.subtitle}</small></button>`).join('');document.querySelectorAll('.station').forEach(b=>b.onclick=()=>{station=b.dataset.station;index=0;hangman={word:'',guesses:[]};prepareStation();render()})}
function signalMarkup(kind){const content={danger:'🚸',prohibit:'↱',obligation:'←',info:'✚<br>▔▔'}[kind]||'!';return `<div class="signal ${kind}" aria-label="Señal de tráfico"><span>${content}</span></div>`}
function socialCard(){return window.socialDeck[index]}
function renderOrderCard(card,head){const picked=window.orderPicks.map(i=>card.words[i]);const available=card.words.map((word,i)=>({word,i})).filter(({i})=>!window.orderPicks.includes(i));app.innerHTML=`${head}<div class="question">${card.prompt}</div><p class="hint">Pulsa las palabras en el orden correcto. Puedes deshacer la última si lo necesitas.</p><div class="passage"><strong>${picked.length?picked.join(' '):'Tu frase aparecerá aquí.'}</strong></div><div class="choices">${available.map(({word,i})=>`<button class="choice" onclick="pickOrderWord(${i})">${word}</button>`).join('')}</div><div class="actions"><button class="secondary" ${picked.length?'':'disabled'} onclick="undoOrderWord()">Deshacer</button><button class="primary" ${picked.length===card.words.length?'':'disabled'} onclick="checkOrderCard()">Comprobar</button></div><p class="feedback" id="feedback"></p>`}
function pickOrderWord(i){window.orderPicks.push(i);renderMixed(activeStation())}
function undoOrderWord(){window.orderPicks.pop();renderMixed(activeStation())}
function checkOrderCard(){const card=socialCard(),good=window.orderPicks.map(i=>card.words[i]).join(' ')===card.answer.join(' ');document.querySelectorAll('.choice,.actions button').forEach(b=>b.disabled=true);$('#feedback').innerHTML=good?'<span class="ok">¡Muy bien! Has ordenado la frase correctamente.</span>':`<span class="no">Casi. La frase correcta es: «${card.answer.join(' ')}».<span class="explain">${card.explain}</span></span>`;advanceSocial(good?850:1800)}
function renderMixed(s){const card=socialCard();if(!card){markDone();finishStation();return}const head=`<div class="badge">${s.title} · tarjeta ${index+1} de ${window.socialDeck.length}</div><h2>${s.title.replace(/^\d\. /,'')}</h2><p class="lead">${s.intro}</p>${card.challenge?'<p class="hint"><strong>🧠 Reto de razonamiento:</strong> aplica lo que sabes para decidir.</p>':''}`;if(card.kind==='order'){renderOrderCard(card,head);return}if(card.kind==='blank'){app.innerHTML=`${head}<div class="question">Completa la frase:</div><p class="passage">${card.before}<label class="sr-only" for="blankInput">Palabra que falta</label><input id="blankInput" class="word-input blank-input" autocomplete="off" autocapitalize="off" placeholder="Escribe una palabra">${card.after}</p><p class="hint">Escribe la palabra completa. Se aceptan mayúsculas o minúsculas, pero las tildes cuentan.</p><div class="actions"><button class="primary" onclick="checkSocialBlank()">Comprobar</button></div><p class="feedback" id="feedback"></p>`;$('#blankInput').onkeydown=e=>{if(e.key==='Enter')checkSocialBlank()};return}app.innerHTML=`${head}${card.kind==='signal'?signalMarkup(card.signal):''}<div class="question">${card.prompt}</div><div class="choices">${card.options.map((x,i)=>`<button class="choice" onclick="answerSocialChoice(${i})">${x}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function wordNormalize(value){return value.replace(/\s+/g,' ').trim().toLocaleLowerCase('es-ES')}
function advanceSocial(delay){setTimeout(()=>{index++;window.orderPicks=[];if(index>=window.socialDeck.length){markDone();finishStation()}else render()},delay)}
function answerSocialChoice(selected){const card=socialCard(),good=selected===card.correct;document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===card.correct)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});$('#feedback').innerHTML=good?'<span class="ok">¡Muy bien! Has acertado.</span>':`<span class="no">Casi. La respuesta correcta está marcada en verde.<span class="explain">${card.explain}</span></span>`;advanceSocial(good?850:1700)}
function checkSocialBlank(){const card=socialCard(),input=$('#blankInput'),good=wordNormalize(input.value)===wordNormalize(card.answer);input.disabled=true;$('#feedback').innerHTML=good?'<span class="ok">¡Muy bien! Has escrito la palabra correcta.</span>':`<span class="no">La palabra que faltaba era «${card.answer}».<span class="explain">${card.explain}</span></span>`;advanceSocial(good?850:1800)}
function renderFreewrite(s){app.innerHTML=`<div class="badge">${s.title}</div><h2>${s.title.replace(/^\d\. /,'')}</h2><p class="lead">${s.prompt}</p><div class="passage"><strong>Tu descripción debe incluir:</strong><ul style="margin:.5rem 0 0;padding-left:1.4rem">${s.points.map(p=>`<li>${p.label}</li>`).join('')}</ul></div><label class="sr-only" for="freeTxt">Escribe tu descripción</label><textarea id="freeTxt" rows="6" placeholder="Escribe aquí tu descripción..." autocomplete="off"></textarea><div class="actions"><button class="primary" onclick="checkFreewrite()">Comprobar</button></div><p class="feedback" id="feedback"></p>`}
function checkFreewrite(){const s=model().stations.find(x=>x.id===station);const words=wordNormalize($('#freeTxt').value).split(/[^a-záéíóúüñ]+/);const results=s.points.map(p=>({label:p.label,ok:p.keywords.some(kw=>words.includes(kw))}));const allOk=results.every(r=>r.ok);const list=results.map(r=>`<li style="list-style:none"><span class="${r.ok?'ok':'no'}">${r.ok?'✓':'✗'} ${r.label}</span></li>`).join('');$('#feedback').innerHTML=`<ul style="padding:0;margin:.5rem 0">${list}</ul>${allOk?'<span class="ok">¡Descripción completa! Has cubierto todos los puntos.</span>':'<span class="no">Faltan algunos puntos. Amplía tu descripción y vuelve a comprobar.</span>'}`;if(allOk){$('#freeTxt').disabled=true;markDone();setTimeout(finishStation,1400)}}
function startExam(){const stations=model().stations;if(['social','mixed','natural'].includes(model().exam)){exam=shuffle(stations.filter(s=>s.cards).flatMap(s=>s.cards)).slice(0,10);examIndex=0;score=0;station='exam';window.orderPicks=[];renderExam();return}const questions=stations.filter(s=>s.type==='choice').flatMap(s=>s.questions.map(q=>({q,station:s})));exam=[...questions].sort(()=>Math.random()-.5).slice(0,7);exam.push({dictation:stations.find(s=>s.type==='dictation')});examIndex=0;score=0;station='exam';renderExam()}
function renderExamOrder(card,num){const picked=window.orderPicks.map(i=>card.words[i]);const available=card.words.map((word,i)=>({word,i})).filter(({i})=>!window.orderPicks.includes(i));app.innerHTML=`<div class="badge">Examen · ${num}</div><h2>Ordena las palabras</h2><div class="question">${card.prompt}</div><p class="hint">Pulsa las palabras en el orden correcto.</p><div class="passage"><strong>${picked.length?picked.join(' '):'Tu frase aparecerá aquí.'}</strong></div><div class="choices">${available.map(({word,i})=>`<button class="choice" onclick="examPickOrder(${i})">${word}</button>`).join('')}</div><div class="actions"><button class="secondary" ${picked.length?'':'disabled'} onclick="examUndoOrder()">Deshacer</button><button class="primary" ${picked.length===card.words.length?'':'disabled'} onclick="examCheckOrder()">Enviar respuesta</button></div><p class="feedback" id="feedback"></p>`}
function examPickOrder(i){window.orderPicks.push(i);renderSocialExam(exam[examIndex],`Pregunta ${examIndex+1} de ${exam.length}`)}
function examUndoOrder(){window.orderPicks.pop();renderSocialExam(exam[examIndex],`Pregunta ${examIndex+1} de ${exam.length}`)}
function examCheckOrder(){const card=exam[examIndex],good=window.orderPicks.map(i=>card.words[i]).join(' ')===card.answer.join(' ');if(good)score++;document.querySelectorAll('.choice,.actions button').forEach(b=>b.disabled=true);$('#feedback').textContent='Respuesta revisada.';setTimeout(()=>{examIndex++;window.orderPicks=[];renderExam()},650)}
function renderSocialExam(card,num){if(card.kind==='order'){renderExamOrder(card,num);return}if(card.kind==='blank'){app.innerHTML=`<div class="badge">Examen · ${num}</div><h2>Completa la frase</h2><p class="passage">${card.before}<label class="sr-only" for="examBlank">Palabra que falta</label><input id="examBlank" class="word-input blank-input" autocomplete="off" autocapitalize="off" placeholder="Escribe una palabra">${card.after}</p><button class="primary" onclick="examSocialBlank()">Enviar respuesta</button><p class="feedback" id="feedback"></p>`;$('#examBlank').onkeydown=e=>{if(e.key==='Enter')examSocialBlank()};return}app.innerHTML=`<div class="badge">Examen · ${num}</div><h2>Elige la respuesta</h2>${card.kind==='signal'?signalMarkup(card.signal):''}<div class="question">${card.prompt}</div><div class="choices">${card.options.map((x,i)=>`<button class="choice" onclick="examSocialChoice(${i})">${x}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function renderExam(){if(examIndex>=exam.length){const pass=score>=Math.ceil(exam.length*.7);app.innerHTML=`<div class="badge">Examen final terminado</div><h2>${pass?'¡Examen superado!':'Examen terminado'}</h2><div class="result"><strong>${score} de ${exam.length} respuestas correctas.</strong><br>${pass?'Buen trabajo: has terminado la ruta.':'Repasa las actividades y vuelve a intentarlo cuando quieras.'}</div><div class="actions"><button class="primary" onclick="startExam()">Repetir examen</button><button class="secondary" onclick="station=model().stations[0].id;index=0;prepareStation();render()">Volver a actividades</button></div>`;return}const item=exam[examIndex],num=`Pregunta ${examIndex+1} de ${exam.length}`;if(subject==='sociales'||['mixed','natural'].includes(model().exam)){renderSocialExam(item,num);return}if(item.dictation){app.innerHTML=`<div class="badge">Examen · ${num}</div><h2>Dictado</h2><p class="lead">Escucha y escribe la frase.</p><div class="dictation-box"><button class="primary" onclick="speakExam()">Reproducir dictado</button><audio id="dictationAudio" controls preload="metadata"><source src="audio/dictado-${grade}.mp3" type="audio/mpeg"></audio><textarea id="examDictation" rows="4" placeholder="Escribe las frases"></textarea></div><button class="primary" onclick="examDictation()">Enviar respuesta</button><p class="feedback" id="feedback"></p>`;return}const q=item.q;app.innerHTML=`<div class="badge">Examen · ${num}</div><h2>Elige la respuesta</h2><div class="question">${q[0]}</div><div class="choices">${q[1].map((x,i)=>`<button class="choice" onclick="examAnswer(${i})">${x}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function examSocialChoice(selected){const card=exam[examIndex],good=selected===card.correct;document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===card.correct)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});if(good)score++;$('#feedback').textContent='Respuesta revisada.';setTimeout(()=>{examIndex++;renderExam()},650)}
function examSocialBlank(){const card=exam[examIndex];if(wordNormalize($('#examBlank').value)===wordNormalize(card.answer))score++;$('#examBlank').disabled=true;$('#feedback').textContent='Respuesta revisada.';setTimeout(()=>{examIndex++;renderExam()},650)}
function render(){updateHeader();updateProgress();const s=activeStation();if(s.type==='mixed')renderMixed(s);else if(s.type==='freewrite')renderFreewrite(s);else if(s.type==='choice')renderChoice(s);else if(s.type==='write')renderWrite(s);else if(s.type==='hangman')renderHangman(s);else if(s.type==='dictation')renderDictation(s)}
switchRoute();
</script>
</body>
</html>
